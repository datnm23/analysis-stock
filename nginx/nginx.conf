# =============================================================================
# VNStock Analysis System — Nginx Reverse Proxy with Load Balancing
# =============================================================================
#
# Scale api-gateway instances:
#   docker-compose --profile production up -d --scale api-gateway=3
#
# Docker's internal DNS resolves "api-gateway" to ALL running containers,
# so the upstream round-robin distributes across every instance automatically.
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging — include X-Request-ID so traces span nginx → api-gateway
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rid=$http_x_request_id';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # -------------------------------------------------------------------------
    # Upstream — round-robin across all api-gateway replicas
    # Docker DNS returns multiple A records when --scale > 1
    # -------------------------------------------------------------------------
    upstream api_gateway {
        least_conn;                  # send to instance with fewest active connections
        server api-gateway:8080;
        keepalive 32;                # reuse connections to reduce latency
    }

    upstream n8n_backend {
        server n8n:5678;
        keepalive 8;
    }

    # -------------------------------------------------------------------------
    # HTTP server — redirect to HTTPS in production, serve directly in staging
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Health check endpoint — bypass auth, used by Docker healthcheck
        location = /nginx-health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
            access_log off;
        }

        # n8n workflow UI
        location /n8n/ {
            proxy_pass         http://n8n_backend/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # All API traffic → api-gateway upstream
        location / {
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Propagate correlation ID; generate one if the client didn't send it
            proxy_set_header   X-Request-ID $request_id;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Buffer settings for API responses
            proxy_buffering    on;
            proxy_buffer_size  4k;
            proxy_buffers      8 4k;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS server (uncomment when certs are provisioned)
    # -------------------------------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/ssl/server.crt;
    #     ssl_certificate_key /etc/nginx/ssl/server.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #
    #     location / {
    #         proxy_pass http://api_gateway;
    #         # ... same headers as above ...
    #     }
    # }
}
