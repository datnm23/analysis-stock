name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.9'
  GO_VERSION: '1.24'

jobs:
  # ============================================
  # Lint and Format Check
  # ============================================

  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install black isort mypy

      - name: Check black formatting
        run: |
          black --check python-sentiment/app

      - name: Check isort imports
        run: |
          isort --check-only python-sentiment/app

      - name: Check mypy types
        run: |
          mypy python-sentiment/app --ignore-missing-imports

  lint-go:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin

      - name: Run golangci-lint
        run: |
          cd go-services
          golangci-lint run ./...

  # ============================================
  # Python Tests
  # ============================================

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('python-sentiment/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r python-sentiment/requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run pytest
        run: |
          cd python-sentiment
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term
        env:
          # Disable auth for tests
          ENABLE_AUTH: "false"

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: python-sentiment/coverage.xml
          flags: python

  # ============================================
  # Go Tests
  # ============================================

  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: |
          cd go-services
          go mod download

      - name: Run tests
        run: |
          cd go-services
          go test -v -race -coverprofile=coverage.xml ./internal/... ./pkg/... ./cmd/...

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: go-services/coverage.xml
          flags: go

  # ============================================
  # Integration Tests
  # ============================================

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-python, test-go]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: |
          cd go-services
          go mod download

      - name: Run integration tests
        run: |
          cd go-services
          go test -tags=integration -v -timeout=5m ./tests/integration/...

  # ============================================
  # Build and Push Images
  # ============================================

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: vnstock
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Python sentiment service
        uses: docker/build-push-action@v5
        with:
          context: ./python-sentiment
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Go API gateway
        uses: docker/build-push-action@v5
        with:
          context: ./go-services
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}-api
          labels: ${{ steps.meta.outputs.labels }}

  # ============================================
  # Security Scan
  # ============================================

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
