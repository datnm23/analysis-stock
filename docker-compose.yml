version: '3.8'

services:
  # ===========================================
  # GO SERVICES (Hybrid Architecture)
  # ===========================================

  # Go API Gateway
  # Scale with: docker-compose --profile production up -d --scale api-gateway=3
  # container_name is intentionally omitted to allow multiple replicas.
  api-gateway:
    build:
      context: ./go-services
      dockerfile: ../docker/go.Dockerfile
      args:
        SERVICE: api-gateway
    restart: unless-stopped
    # Direct port mapping only used in development (single instance).
    # In production profile, traffic arrives via nginx on port 80/443.
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=vnstock
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=vnstock
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SENTIMENT_SERVICE_URL=http://sentiment:8000
      - TECHNICAL_SERVICE_URL=http://technical-agent:8081
      - FORECAST_SERVICE_URL=http://forecast-agent:8082
      - VNSTOCK_BASE_URL=${VNSTOCK_BASE_URL:-https://apipubaws.tcbs.com.vn/stock-insight/v1}
    depends_on:
      - postgres
      - redis
      - sentiment
    networks:
      - vnstock-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Go Technical Analysis Agent
  technical-agent:
    build:
      context: ./go-services
      dockerfile: ../docker/go.Dockerfile
      args:
        SERVICE: technical-agent
    container_name: vnstock-technical
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=vnstock
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=vnstock
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    networks:
      - vnstock-net

  # Go Forecast Agent
  forecast-agent:
    build:
      context: ./go-services
      dockerfile: ../docker/go.Dockerfile
      args:
        SERVICE: forecast-agent
    container_name: vnstock-forecast
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=vnstock
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=vnstock
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TECHNICAL_SERVICE_URL=http://technical-agent:8080
      - SENTIMENT_SERVICE_URL=http://sentiment:8000
    depends_on:
      - postgres
      - redis
    networks:
      - vnstock-net

  # Go Master Orchestrator
  master-orchestrator:
    build:
      context: ./go-services
      dockerfile: ../docker/go.Dockerfile
      args:
        SERVICE: master-orchestrator
    container_name: vnstock-orchestrator
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=vnstock
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=vnstock
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TECHNICAL_SERVICE_URL=http://technical-agent:8080
      - SENTIMENT_SERVICE_URL=http://sentiment:8000
      - FORECAST_SERVICE_URL=http://forecast-agent:8080
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
    depends_on:
      - postgres
      - redis
      - technical-agent
      - sentiment
      - forecast-agent
    networks:
      - vnstock-net

  # Telegram Bot for alerts and user interaction
  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: vnstock-telegram-bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID:-@vnstock_alerts}
      - TELEGRAM_URGENT_CHANNEL_ID=${TELEGRAM_URGENT_CHANNEL_ID:-@vnstock_urgent_alerts}
      - API_GATEWAY_URL=http://api-gateway:8080
      - TELEGRAM_USE_WEBHOOK=${TELEGRAM_USE_WEBHOOK:-false}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL:-}
      - PORT=8084
    depends_on:
      - api-gateway
    networks:
      - vnstock-net
    profiles:
      - bot

  # ===========================================
  # PYTHON SERVICES (Hybrid Architecture)
  # ===========================================

  # Python Sentiment Analysis Agent (PhoBERT)
  sentiment:
    build:
      context: ./python-sentiment
      dockerfile: Dockerfile
    container_name: vnstock-sentiment
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "50051:50051"  # gRPC
    environment:
      - PORT=8000
      - GRPC_PORT=50051
      - MODEL_NAME=vinai/phobert-base
      - MODEL_CACHE_DIR=/app/.cache
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TELEGRAM_APP_API_ID=${TELEGRAM_APP_API_ID}
      - TELEGRAM_APP_API_HASH=${TELEGRAM_APP_API_HASH}
      - ENABLE_ML_FORECAST=${ENABLE_ML_FORECAST:-false}
      - LSTM_WEIGHTS_PATH=${LSTM_WEIGHTS_PATH:-models/lstm_forecast.pt}
      - LSTM_SEQUENCE_LENGTH=${LSTM_SEQUENCE_LENGTH:-60}
      - LSTM_FORECAST_DAYS=${LSTM_FORECAST_DAYS:-5}
      - USE_ONNX=${USE_ONNX:-false}
      - ONNX_MODEL_DIR=${ONNX_MODEL_DIR:-models/onnx}
    volumes:
      - sentiment_cache:/app/.cache
    networks:
      - vnstock-net
    deploy:
      resources:
        limits:
          memory: 2G  # 4G with PyTorch, 2G sufficient with ONNX INT8
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Model loading takes time

  # ===========================================
  # INFRASTRUCTURE
  # ===========================================

  # n8n Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: vnstock-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n:5678/
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
      # Database
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/.n8n/workflows
    depends_on:
      - postgres
      - redis
    networks:
      - vnstock-net

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: vnstock-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=vnstock
      - POSTGRES_USER=vnstock
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Use migrations instead of legacy init.sql (GAP-9)
      - ./go-services/migrations:/docker-entrypoint-initdb.d/migrations:ro
    ports:
      - "5432:5432"
    networks:
      - vnstock-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnstock -d vnstock"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: vnstock-cache
    restart: unless-stopped
    ports:
      - "16379:6379"
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    networks:
      - vnstock-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD --no-auth-warning} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # OPTIONAL SERVICES (use with profiles)
  # ===========================================

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: vnstock-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api-gateway
      - n8n
    networks:
      - vnstock-net
    profiles:
      - production

  # Jaeger Distributed Tracing UI
  # Access: http://localhost:16686
  # Collects spans via OTLP HTTP on port 4318 (ready for OTel SDK integration)
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: vnstock-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP collector (for future OTel SDK)
      - "6831:6831/udp" # Jaeger agent (Thrift compact)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - vnstock-net
    profiles:
      - monitoring

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: vnstock-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - vnstock-net
    profiles:
      - monitoring

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: vnstock-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - vnstock-net
    profiles:
      - monitoring

  # PostgreSQL Automated Backup
  db-backup:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    container_name: vnstock-db-backup
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=vnstock
      - DB_NAME=vnstock
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
    volumes:
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vnstock-net
    profiles:
      - backup

  # MinIO (S3-compatible for local development)
  minio:
    image: minio/minio:latest
    container_name: vnstock-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - vnstock-net
    profiles:
      - development

  # ============================================
  # Firecrawl Self-Hosted (HTML→Markdown engine)
  # ============================================

  firecrawl-api:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: vnstock-firecrawl
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - HOST=0.0.0.0
      - USE_DB_AUTHENTICATION=false
      - REDIS_URL=redis://redis:6379
      - REDIS_RATE_LIMIT_URL=redis://redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://firecrawl-playwright:3000/scrape
      - NUQ_RABBITMQ_URL=amqp://firecrawl-rabbitmq:5672
      - BULL_AUTH_KEY=${FIRECRAWL_BULL_KEY:-firecrawl-local}
      - NUM_WORKERS_PER_QUEUE=4
      - CRAWL_CONCURRENT_REQUESTS=5
      - MAX_CONCURRENT_JOBS=3
      - BROWSER_POOL_SIZE=3
    depends_on:
      redis:
        condition: service_healthy
      firecrawl-playwright:
        condition: service_started
      firecrawl-rabbitmq:
        condition: service_healthy
    networks:
      - vnstock-net
    deploy:
      resources:
        limits:
          memory: 4G
    profiles:
      - crawl

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: vnstock-firecrawl-pw
    restart: unless-stopped
    environment:
      - PORT=3000
      - BLOCK_MEDIA=true
      - MAX_CONCURRENT_PAGES=5
    networks:
      - vnstock-net
    deploy:
      resources:
        limits:
          memory: 2G
    profiles:
      - crawl

  firecrawl-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vnstock-firecrawl-rmq
    restart: unless-stopped
    networks:
      - vnstock-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - crawl

  # ============================================
  # Crawl Agent (multi-tier news aggregation)
  # ============================================

  crawl-agent:
    build:
      context: ./crawl-agent
      dockerfile: Dockerfile
    container_name: vnstock-crawl
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - FIRECRAWL_API_URL=http://firecrawl-api:3002
      - SENTIMENT_SERVICE_URL=http://sentiment:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - TELEGRAM_APP_API_ID=${TELEGRAM_APP_API_ID}
      - TELEGRAM_APP_API_HASH=${TELEGRAM_APP_API_HASH}
      - TELEGRAM_CHANNELS=${TELEGRAM_CHANNELS:-chungkhoanUG,ChungkhoanGalaxy,finbotrealtimenews}
      - SCRAPE_INTERVAL_MINUTES=30
      - SCRAPE_MARKET_HOURS_ONLY=true
      - ENABLE_FIRECRAWL=true
      - ENABLE_TELEGRAM=${ENABLE_TELEGRAM:-false}
    volumes:
      - crawl_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      sentiment:
        condition: service_healthy
    networks:
      - vnstock-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - crawl

volumes:
  n8n_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  sentiment_cache:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
  minio_data:
    driver: local
  nginx_logs:
    driver: local
  crawl_data:
    driver: local
  backup_data:
    driver: local

networks:
  vnstock-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

