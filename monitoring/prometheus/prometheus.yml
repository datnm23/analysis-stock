global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'technical-agent'
    metrics_path: /metrics
    static_configs:
      - targets: ['technical-agent:8080']

  - job_name: 'forecast-agent'
    metrics_path: /metrics
    static_configs:
      - targets: ['forecast-agent:8080']

  - job_name: 'master-orchestrator'
    metrics_path: /metrics
    static_configs:
      - targets: ['master-orchestrator:8080']
